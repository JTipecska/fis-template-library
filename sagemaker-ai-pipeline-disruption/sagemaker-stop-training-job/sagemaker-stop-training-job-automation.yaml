description: "Discover and stop running SageMaker training jobs with a specific tag to simulate training job interruption"
schemaVersion: "0.3"
assumeRole: "{{ AutomationAssumeRole }}"
parameters:
  tagKey:
    type: String
    description: "Tag key to identify SageMaker training jobs to stop"
    default: "FIS-Ready"
  tagValue:
    type: String
    description: "Tag value to identify SageMaker training jobs to stop"
    default: "True"
  duration:
    type: String
    description: "Observation window duration in ISO8601 format after jobs are stopped"
    default: "PT10M"
  region:
    type: String
    description: "AWS Region of the SageMaker training jobs"
    default: "{{global:REGION}}"
  AutomationAssumeRole:
    type: String
    description: "IAM role for the automation execution"
    default: ""

mainSteps:
  - name: discoverTrainingJobs
    action: aws:executeScript
    inputs:
      Runtime: python3.11
      Handler: discover_training_jobs
      Script: |
        import boto3

        def discover_training_jobs(events, context):
            region = events['region']
            tag_key = events['tagKey']
            tag_value = events['tagValue']

            sm = boto3.client('sagemaker', region_name=region)
            target_jobs = []

            paginator = sm.get_paginator('list_training_jobs')
            for page in paginator.paginate(StatusEquals='InProgress'):
                for job in page.get('TrainingJobSummaries', []):
                    job_name = job['TrainingJobName']
                    job_arn = job['TrainingJobArn']
                    try:
                        tags_response = sm.list_tags(ResourceArn=job_arn)
                        tags = {t['Key']: t['Value'] for t in tags_response.get('Tags', [])}
                        if tags.get(tag_key) == tag_value:
                            target_jobs.append(job_name)
                    except Exception as e:
                        print(f"Error retrieving tags for {job_name}: {str(e)}")
                        continue

            if not target_jobs:
                raise RuntimeError(
                    f"No InProgress SageMaker training jobs found with tag {tag_key}={tag_value}. "
                    "Ensure at least one training job is running and tagged before starting the experiment."
                )

            print(f"Discovered {len(target_jobs)} target training job(s): {target_jobs}")
            return target_jobs
      InputPayload:
        region: "{{ region }}"
        tagKey: "{{ tagKey }}"
        tagValue: "{{ tagValue }}"
    outputs:
      - Name: targetJobs
        Selector: $.Payload
        Type: StringList
    description: "Find all InProgress SageMaker training jobs with the specified tag"

  - name: stopTrainingJobs
    action: aws:executeScript
    onFailure: "step:verifyJobsStopped"
    onCancel: "step:verifyJobsStopped"
    inputs:
      Runtime: python3.11
      Handler: stop_training_jobs
      Script: |
        import boto3

        def stop_training_jobs(events, context):
            region = events['region']
            target_jobs = events['targetJobs']

            sm = boto3.client('sagemaker', region_name=region)
            stopped = []

            for job_name in target_jobs:
                try:
                    sm.stop_training_job(TrainingJobName=job_name)
                    stopped.append(job_name)
                    print(f"Stop request sent for training job: {job_name}")
                except sm.exceptions.ResourceNotFound:
                    print(f"Training job {job_name} not found — may have already completed")
                except Exception as e:
                    raise RuntimeError(f"Failed to stop training job {job_name}: {e}") from e

            print(f"Stop requested for {len(stopped)} job(s): {stopped}")
            return stopped
      InputPayload:
        region: "{{ region }}"
        targetJobs: "{{ discoverTrainingJobs.targetJobs }}"
    outputs:
      - Name: stoppedJobs
        Selector: $.Payload
        Type: StringList
    description: "Send stop request to all discovered training jobs"

  - name: waitForDuration
    action: "aws:sleep"
    onFailure: "step:verifyJobsStopped"
    onCancel: "step:verifyJobsStopped"
    inputs:
      Duration: "{{ duration }}"
    description: "Observation window — wait for downstream systems to react to the training job interruption"

  - name: verifyJobsStopped
    action: aws:executeScript
    inputs:
      Runtime: python3.11
      Handler: verify_jobs_stopped
      Script: |
        import boto3

        def verify_jobs_stopped(events, context):
            region = events['region']
            stopped_jobs = events['stoppedJobs']

            sm = boto3.client('sagemaker', region_name=region)
            results = []

            for job_name in stopped_jobs:
                try:
                    response = sm.describe_training_job(TrainingJobName=job_name)
                    status = response['TrainingJobStatus']
                    results.append(f"{job_name}: {status}")
                    print(f"Training job {job_name} final status: {status}")
                except Exception as e:
                    results.append(f"{job_name}: error retrieving status — {str(e)}")
                    print(f"Could not retrieve status for {job_name}: {str(e)}")

            return results
      InputPayload:
        region: "{{ region }}"
        stoppedJobs: "{{ stopTrainingJobs.stoppedJobs }}"
    outputs:
      - Name: results
        Selector: $.Payload
        Type: StringList
    description: "Verify final status of all stopped training jobs and log results"
    isEnd: true
